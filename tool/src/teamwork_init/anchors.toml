# The anchors: the strings the template set already carries as placeholders, and
# what each becomes once the wizard has an answer for it.
#
# `template/` stays byte-identical to what `cp -r` would give you, so the manual
# path documented in USING-THIS-FRAMEWORK.md keeps working. The cost of that is
# that these strings are a copy of text living somewhere else, and a template
# edit can break one silently — so `teamwork-init verify` asserts that every
# anchor below occurs exactly once in the file it names, and the `check` task
# runs it.
#
# `render` names a function in `anchors.py`. `arg` is passed to it. An anchor
# whose renderer returns nothing leaves the placeholder alone, which is the right
# outcome for anything only a person can write.

[[anchor]]
file = "README.md"
render = "project_title"
find = "# *(Project name)*"

[[anchor]]
file = "README.md"
render = "description"
find = """
*One or two sentences: what this is and what it does. Written for somebody who
arrived from a link and knows nothing — this is the landing page.*"""

[[anchor]]
file = "CLAUDE.md"
render = "kind_sentence"
find = "**Kind:** *(unset — spike · learning · on spec · production)*."

[[anchor]]
file = "CLAUDE.md"
render = "bar_sentence"
find = """
**The bar:** *(one sentence: what this project owes whoever uses it, and what it
does not.)*"""

